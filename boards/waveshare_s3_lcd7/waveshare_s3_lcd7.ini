############################## Waveshare ESP32-S3-Touch-LCD-7 ####################################
; Waveshare ESP32-S3-Touch-LCD-7 (https://www.waveshare.com/wiki/ESP32-S3-Touch-LCD-7)
; Hardware: ESP32-S3-WROOM-1-N16R8 (16MB Flash, 8MB OPI PSRAM)
;           800x480 16-bit RGB panel (ST7262), frame buffer in PSRAM (Arduino_GFX backend)
;           GT911 capacitive touch and CH422G I/O expander on I2C SDA=8, SCL=9
; CH422G:         EXIO1 touch reset, EXIO2 backlight (on/off only), EXIO3 LCD reset,
;                 EXIO4 TF card CS, EXIO5 native USB/CAN select (kept high)
; Touch GT911:    INT=4, addr 0x5D
; SD Card SPI:    MOSI=11, MISO=13, SCK=12, CS=EXIO4 (driven through the expander)
; Serial:         UART0 (CH343, the "UART" USB-C port) via ARDUINO_USB_CDC_ON_BOOT=0
;
; Partition table: the cheap-yellow-board launcher's S3 layout (launcher in factory, this image in
; a 4 MB OTA slot). It has no spiffs/LittleFS partition, so Bruce keeps its files on the TF card.

[env:waveshare-s3-lcd7]
board = esp32-s3-devkitc1-n16r8
board_build.arduino.memory_type = qio_opi
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.partitions = custom_launcher_s3.csv
build_src_filter = ${env.build_src_filter} +<../boards/waveshare_s3_lcd7>
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-Iboards/waveshare_s3_lcd7
	-Os
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DBOARD_HAS_PSRAM
	-DDISABLE_ALL_LIBRARY_WARNINGS
	-DWAVESHARE_S3_LCD7

	; No speaker, microphone or RGB LED
	-DRGB_LED=-1

	; RS485 header pins (GPIO15 TX, GPIO16 RX) are the only free GPIOs besides GPIO6 (sensor header)
	-DBAD_TX=15
	-DBAD_RX=16

	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=15
	-DGPS_SERIAL_RX=16

	; Buttons - touch only
	-DHAS_BTN=0
	-DBTN_ALIAS='"Ok"'
	-DBTN_PIN=0

	-DIR_TX_PINS='{{"Pin 6", 6}, {"Pin 15", 15}, {"Pin 16", 16}}'
	-DIR_RX_PINS='{{"Pin 6", 6}, {"Pin 15", 15}, {"Pin 16", 16}}'
	-DTXLED=-1
	-DLED_ON=HIGH
	-DLED_OFF=LOW

	-DRF_TX_PINS='{{"Pin 6", 6}, {"Pin 15", 15}, {"Pin 16", 16}}'
	-DRF_RX_PINS='{{"Pin 6", 6}, {"Pin 15", 15}, {"Pin 16", 16}}'

	; Font sizes for 800x480
	-DFP=2
	-DFM=3
	-DFG=4

	; Screen. Bruce's convention is TFT_WIDTH = short side and ROTATION 1 = landscape; the RGB panel
	; itself is natively 800x480, so the HAL offsets the rotation (see TFT_ROTATION_OFFSET).
	-DHAS_SCREEN=1
	-DROTATION=1
	-DMINBRIGHT=1
	-DTFT_WIDTH=480
	-DTFT_HEIGHT=800

	; Touch GT911 capacitive I2C
	-DHAS_TOUCH=1
	-DHAS_CAPACITIVE_TOUCH=1
	-DTOUCH_GT911_I2C=1
	-DGT911_SLAVE_ADDRESS_L=0x5D
	-DSYS_I2C_SDA=8
	-DSYS_I2C_SCL=9
	-DBOARD_TOUCH_INT=4

	; SD Card SPI; CS is EXIO4 on the CH422G (-1 here makes sd_diskio call sdExternalCS())
	-DSDCARD_CS=-1
	-DSDCARD_SCK=12
	-DSDCARD_MISO=13
	-DSDCARD_MOSI=11

	-DSPI_SCK_PIN=12
	-DSPI_MOSI_PIN=11
	-DSPI_MISO_PIN=13
	-DSPI_SS_PIN=-1

	-DDEVICE_NAME='"Waveshare S3 LCD 7"'

; No addressable LED (FastLED is only used with HAS_RGB_LED). Current FastLED releases also break
; on the command-line -DFP font macro (fl/audio/fft has a `using FP = ...`).
lib_ignore =
	FastLED
lib_deps =
	${env.lib_deps}
	lewisxhe/SensorLib @ 0.3.4
	moononournation/GFX Library for Arduino @ ^1.5.5
############################ END Waveshare ESP32-S3-Touch-LCD-7 ###################################
