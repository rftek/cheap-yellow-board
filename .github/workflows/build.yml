# Builds this branch's boot image and publishes it as firmware.bin on a
# release tagged with the branch name, which is where the launcher on the
# bootloader branch looks for it.
name: Build boot image

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_BUILD_DIR: ${{ github.workspace }}/build
      # Bluepad32's CMake integration reads these; they must be set for the
      # cmake configure that `pio run` triggers, so keep them at job scope.
      BLUEPAD32_ROOT: ${{ github.workspace }}/external/bluepad32
      BTSTACK_ROOT: ${{ github.workspace }}/external/bluepad32/external/btstack
    steps:
      - uses: actions/checkout@v4
        with:
          # Bluepad32 and its nested BTstack submodule live under external/.
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bluepad32 ships a patch for its BTstack copy (an l2cap fix for incoming
      # controller connections). The component wiring itself is done in CMake.
      - name: Patch Bluepad32's BTstack
        run: |
          cd "$BTSTACK_ROOT"
          git apply "$BLUEPAD32_ROOT"/external/patches/*.patch \
            || echo "BTstack patch already applied or not needed"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - run: pip install platformio

      - name: Build
        run: |
          set -o pipefail
          pio run 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          # build_dir in platformio.ini is under USERPROFILE, which Linux lacks.
          USERPROFILE: ${{ runner.temp }}

      # Actions logs need a sign-in to read; a release asset does not. On a
      # failed build, publish the full log so it can be inspected. Delete the
      # ci-log release once the build is green.
      - name: Upload build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/build.log" build.log
          gh release view ci-log >/dev/null 2>&1 \
            || gh release create ci-log --title "CI build log" --notes "Transient debug log"
          gh release upload ci-log build.log --clobber

      - name: Publish firmware.bin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp build/esp32dev/firmware.bin firmware.bin
          notes="Boot image built from ${GITHUB_SHA::7} on branch $TAG."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$notes"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
          gh release upload "$TAG" firmware.bin --clobber
