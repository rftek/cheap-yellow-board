[platformio]
default_envs = esp32s3
src_dir = main
build_dir = ${sysenv.USERPROFILE}/.platformio/cyd-drumkey-build

; ESP32-S3-Touch-LCD-7: 16 MB flash, 8 MB octal PSRAM (sdkconfig.defaults.esp32s3).
; This app targets the S3 board only (supported-targets.txt), so it has no
; esp32 environment.
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.esp32s3.csv
