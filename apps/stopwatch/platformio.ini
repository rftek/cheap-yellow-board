[platformio]
default_envs = esp32
src_dir = main
build_dir = ${sysenv.USERPROFILE}/.platformio/cyd-stopwatch-build

; ESP32 Cheap Yellow Display.
[env:esp32]
platform = espressif32@7.1.3
board = esp32dev
framework = espidf
monitor_speed = 115200

; ESP32-S3-Touch-LCD-7: 16 MB flash, 8 MB octal PSRAM (sdkconfig.defaults.esp32s3).
; Prepared for the S3 board; CI builds it only once esp32s3 is listed in
; supported-targets.txt.
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.esp32s3.csv
