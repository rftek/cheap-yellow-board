[platformio]
default_envs = esp32s3
src_dir = main
build_dir = ${sysenv.USERPROFILE}/.platformio/cyd-odin_s3-build

; ESP32-S3-Touch-LCD-7: 16 MB flash, 8 MB octal PSRAM (sdkconfig.defaults.esp32s3).
; This app targets the S3 board only (supported-targets.txt), so it has no
; esp32 environment.
[env:esp32s3]
platform = espressif32@7.1.3
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.esp32s3.csv
; Odin 2's wavetables, embedded as in main/CMakeLists.txt (EMBED_FILES).
board_build.embed_files = main/wavetables.bin
; The image (2.2 MB, most of it wavetables) runs from a launcher slot, ota_0
; or ota_1 (4 MB each), not the 2 MB factory partition the launcher holds:
; check its size against a slot.
board_build.app_partition_name = ota_0
