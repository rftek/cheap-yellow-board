[platformio]
default_envs = esp32dev
src_dir = main
build_dir = ${sysenv.USERPROFILE}/.platformio/cyd-birdnet-build

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
; Size-check against the 1.31 MB launcher slot rather than a 1 MB factory app.
board_build.partitions = ../../launcher/partitions.csv
